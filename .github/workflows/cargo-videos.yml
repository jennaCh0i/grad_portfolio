name: Import videos from Cargo site
on: workflow_dispatch
permissions:
  contents: write
jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: cargo-import }
      - uses: actions/checkout@v4
        with: { ref: main, path: main }
      - name: Download and compress
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p cargo-import/videos
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -fsSL -o "/tmp/$name.src" "$url" || { echo "FAIL $name"; continue; }
            ffmpeg -loglevel error -y -i "/tmp/$name.src" -an \
              -vf "scale='min(1600,iw)':-2,fps=30" -c:v libx264 -preset veryfast -crf 26 \
              -pix_fmt yuv420p -movflags +faststart "cargo-import/videos/$name.mp4" || echo "FFMPEG FAIL $name"
            ffmpeg -loglevel error -y -ss 0.5 -i "cargo-import/videos/$name.mp4" -frames:v 1 -vf scale=480:-2 "cargo-import/videos/$name.jpg" || true
            echo "$name $(du -h cargo-import/videos/$name.mp4 | cut -f1)"
          done < main/tools/cargo-videos.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add cargo-import/videos
          git commit -m "Import compressed videos from jennachoi.work"
          git push origin cargo-import
